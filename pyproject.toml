[project]
name = "crewai_exec_deep_research_agent"
version = "0.1.0"
description = "crewai-exec-deep-research-agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    # The 'anthropic' extra is required by the agents' "anthropic/claude-sonnet-5"
    # model strings - without it CrewAI raises at agent construction time.
    "crewai[tools,anthropic]>=1.15.16,<2.0.0"
]

[project.scripts]
kickoff = "crewai_exec_deep_research_agent.main:kickoff"
run_crew = "crewai_exec_deep_research_agent.main:kickoff"
plot = "crewai_exec_deep_research_agent.main:plot"
run_with_trigger = "crewai_exec_deep_research_agent.main:run_with_trigger"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "99edc883-6d2b-4834-8661-3ae2536a0216"
